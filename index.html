  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie - Restaurant website</title>
    <link rel="stylesheet" href="style.css">
     <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

  </head>
  <body>
    <!-- Login Modal-->
     <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close" aria-label="Close login modal">&times;</span>
        <h2>Login to Foodie</h2>
        <form id="loginForm">
          <div class="form-group">
            <input type="email" id="email" placeholder="Email" required aria-required="true">
            <label for="email">Email</label>
          </div>
          <div class="form-group">
            <input type="password" id="password" placeholder="Password" required aria-required="true">
            <label for="password">Password</label>
          </div>
          <div class="form-group">
            <button type="submit" aria-label="Submit login form">Login</button>
        </form>
      </div>
     </div>
    
    <script src="script.js"></script>
  </body>
  </html>
